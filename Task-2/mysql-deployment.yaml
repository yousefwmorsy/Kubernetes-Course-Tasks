apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: webapp-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: webapp-mysql:task2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password

            - name: APP_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: app-user

            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: app-password

            - name: APP_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: webapp-config
                  key: MYSQL_DATABASE
          
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          
          readinessProbe:
            exec:
              command:
                - /usr/bin/mysqladmin
                - ping
                - -h
                - 127.0.0.1

          livenessProbe:
            exec:
              command:
                - /usr/bin/mysqladmin
                - ping
                - -h
                - 127.0.0.1
            initialDelaySeconds: 60 

      volumes: 
        - name: data
          persistentVolumeClaim:
            claimName: mysql-pvc
  
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: webapp-stack
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
